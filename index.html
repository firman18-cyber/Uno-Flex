<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UNO FLEX — Login</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="login">
  <div class="uno-logo"><span>UNO</span><b>FLEX!</b></div>

  <section class="login-card">
    <div class="label green">NAMA KAMU</div>
    <input id="playerName" maxlength="20" placeholder="Masukkan nama kamu">

    <div class="label yellow">KODE ROOM</div>
    <input id="roomCode" maxlength="8" placeholder="Masukkan kode room" autocomplete="off">

    <div class="buttons">
      <button id="createBtn" class="btn green-btn">BUAT ROOM</button>
      <button id="joinBtn" class="btn blue-btn">JOIN ROOM</button>
    </div>
    <p id="status"></p>
  </section>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
