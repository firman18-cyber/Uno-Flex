<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UNO Flex — Multiplayer</title>
    <!-- Import Font dari Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --green-active: #7ED957;
            --red-inactive: #FF1616;
            --bg-color: #0d2e14; /* Warna hijau gelap dasar */
            --text-color: #ffffff;
            --card-width: 170px;
            --card-height: 255px;
        }

        * { 
            box-sizing: border-box; 
            font-family: 'Luckiest Guy', cursive; 
            letter-spacing: 1px;
        }
        
        body, html { 
            background-color: var(--bg-color); 
            /* GANTI URL DI BAWAH INI JIKA INGIN GAMBAR BACKGROUND SENDIRI */
            background-image: url('back.png'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-color); 
            margin: 0; 
            padding: 0; 
            height: 100vh;
            width: 100vw;
            overflow: hidden; /* Mencegah scroll pada keseluruhan layar */
            display: flex; 
            flex-direction: column; 
            align-items: center;
        }

        .hidden { display: none !important; }

        /* ================= SETUP SECTION ================= */
        .setup-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            width: 100%;
            padding: 20px;
            background: rgba(0, 0, 0, 0.6);
        }
        .setup-panel { 
            background: rgba(0, 0, 0, 0.7); 
            padding: 25px; 
            border-radius: 15px; 
            border: 2px solid var(--green-active);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5); 
            width: 100%; 
            max-width: 350px; 
            text-align: center; 
        }
        .setup-title { color: #f1c40f; font-size: 2.5rem; margin: 0 0 15px 0; text-shadow: 3px 3px 0 #000; }
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 1rem; color: #fff; text-shadow: 1px 1px 0 #000; }
        .form-group input { width: 100%; padding: 12px; border-radius: 8px; border: none; font-size: 1.2rem; outline: none; background: #fff; color: #000; }
        button { background: #3498db; color: white; border: none; padding: 12px; font-size: 1.2rem; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 5px; text-shadow: 1px 1px 0 #000; transition: transform 0.1s; }
        button:active { transform: scale(0.95); }
        .btn-green { background: var(--green-active); color: #000; text-shadow: none; border: 2px solid #000; }
        .divider { margin: 15px 0; color: #fff; font-size: 1rem; text-shadow: 1px 1px 0 #000; }

        /* ================= GAME SECTION ================= */
        #game-section {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 500px;
            height: 100%;
            position: relative;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px 5px 20px;
            font-size: 1.3rem;
            text-shadow: 2px 2px 0 #000;
        }
        .top-bar .room-text { color: white; }
        .top-bar .player-info { display: flex; align-items: center; gap: 8px; }
        .conn-dot { width: 15px; height: 15px; border-radius: 50%; background: var(--green-active); box-shadow: 0 0 5px #000; }
        .conn-red { background: var(--red-inactive); }

        /* Aturan Rules Text */
        .rules-container {
            text-align: center;
            padding: 5px 20px;
            line-height: 1.2;
            text-shadow: 2px 2px 0 #000;
        }
        .r-title { color: #f1c40f; font-size: 1.1rem; margin-bottom: 5px; }
        .r-green { color: var(--green-active); font-size: 0.95rem; margin-bottom: 2px; }
        .r-red { color: var(--red-inactive); font-size: 0.95rem; margin-bottom: 2px; }
        .r-white { color: #ffffff; font-size: 0.95rem; }

        /* Area Kartu Pemain Sendiri */
        .my-card-area {
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 15px;
        }
        
        /* 3D Card */
        .card-container { perspective: 1000px; width: var(--card-width); height: var(--card-height); cursor: pointer; transition: transform 0.1s; }
        .card-container:active { transform: scale(0.95); } /* Efek saat disentuh */
        .power-card { width: 100%; height: 100%; position: relative; transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); transform-style: preserve-3d; }
        .power-card.flipped { transform: rotateY(180deg); }
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 15px; border: 8px solid white; box-shadow: 0 10px 20px rgba(0,0,0,0.5); display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        .card-front { background-color: var(--green-active); background-image: url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M10 20 l5 5 l15 -15' stroke='rgba(0,100,0,0.15)' stroke-width='6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"); }
        .card-back { background-color: var(--red-inactive); background-image: url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M12 12 l16 16 M28 12 l-16 16' stroke='rgba(100,0,0,0.15)' stroke-width='6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E"); transform: rotateY(180deg); }
        
        .card-icon-wrapper { background: white; width: 90px; height: 90px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 6px solid #222; box-shadow: inset 0 0 8px rgba(0,0,0,0.3); z-index: 2; }
        .card-front .card-icon-wrapper svg { color: var(--green-active); width: 55px; height: 55px; }
        .card-back .card-icon-wrapper svg { color: var(--red-inactive); width: 55px; height: 55px; }
        
        /* Teks Status di bawah kartu */
        .card-status-text { margin-top: 15px; font-size: 2rem; color: #fff; text-shadow: 3px 3px 0 #000; font-style: italic; }

        /* Area Daftar Lawan (Scrollable Bottom Sheet) */
        .opponents-sheet {
            background-color: #f4f4f4;
            flex-grow: 1; /* Mengisi sisa ruang di bawah */
            margin-top: 20px;
            border-radius: 25px 25px 0 0;
            padding: 20px;
            overflow-y: auto; /* SCROLL HANYA DI SINI */
            box-shadow: 0 -5px 15px rgba(0,0,0,0.4);
            width: 100%;
        }
        
        .opp-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #ccc;
            padding: 12px 0;
        }
        .opp-name { color: #000; font-size: 1.4rem; text-shadow: 1px 1px 0px rgba(0,0,0,0.2); }
        .opp-pill { width: 70px; height: 25px; border-radius: 20px; box-shadow: inset 0 2px 4px rgba(0,0,0,0.3); }
        .pill-green { background-color: var(--green-active); }
        .pill-red { background-color: var(--red-inactive); }

        /* Toast Popup */
        #toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 1000; display: flex; flex-direction: column; gap: 8px; width: 90%; max-width: 400px; }
        .toast { background: rgba(0, 0, 0, 0.9); color: white; padding: 12px 15px; border-radius: 8px; font-size: 1rem; animation: slideDown 0.3s ease-out; text-align: center; border: 2px solid #f1c40f; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <!-- AREA SETUP AWAL -->
    <div id="setup-section" class="setup-container">
        <div class="setup-panel">
            <h1 class="setup-title">UNO FLEX</h1>
            <div class="form-group">
                <label>NAMA PEMAIN:</label>
                <input type="text" id="player-name" placeholder="NAMA..." autocomplete="off">
            </div>
            <button id="btn-create-room" class="btn-green">BUAT ROOM</button>
            <div class="divider">ATAU</div>
            <div class="form-group">
                <label>KODE ROOM:</label>
                <input type="text" id="room-code" placeholder="ABCD" style="text-transform: uppercase;">
            </div>
            <button id="btn-join-room">GABUNG ROOM</button>
        </div>
    </div>

    <!-- AREA GAME UTAMA -->
    <div id="game-section" class="hidden">
        
        <!-- Bar Atas -->
        <div class="top-bar">
            <div class="room-text">ROOM: <span id="display-room-code">----</span></div>
            <div class="player-info">
                <div id="conn-indicator" class="conn-dot"></div>
                <span id="display-my-name">NAMA</span>
            </div>
        </div>

        <!-- Aturan Teks -->
        <div class="rules-container">
            <div class="r-title">ATURAN POWER CARD:</div>
            <div class="r-green">AKTIF: BOLEH PAKAI KEMAMPUAN FLEX</div>
            <div class="r-red">NONAKTIF: FLEX TERKUNCI SAMPAI DIKEMBALIKAN</div>
            <div class="r-white">JIKA SEMUA MERAH, SISTEM MERESET KE HIJAU</div>
        </div>

        <!-- Kartu Pemain Sendiri -->
        <div class="my-card-area">
            <div class="card-container" id="my-card-container">
                <div class="power-card" id="my-power-card">
                    <div class="card-face card-front">
                        <div class="card-icon-wrapper"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></div>
                    </div>
                    <div class="card-face card-back">
                        <div class="card-icon-wrapper"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></div>
                    </div>
                </div>
            </div>
            <div id="my-card-status" class="card-status-text">KARTU AKTIF</div>
        </div>

        <!-- Area Scroll Lawan -->
        <div class="opponents-sheet">
            <div id="opponents-list">
                <!-- Lawan akan muncul di sini -->
            </div>
        </div>

    </div>

    <div id="toast-container"></div>

    <!-- SCRIPT FIREBASE & LOGIKA GAME -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getDatabase, ref, set, get, update, onValue, onDisconnect, remove } 
            from "https://www.gstatic.com/firebasejs/10.4.0/firebase-database.js";

        // TODO: GANTI DENGAN KONFIGURASI FIREBASE MILIK ANDA
        const firebaseConfig = {
            apiKey: "AIzaSyAsUmrDn3pI8J4q1XnTU4KcnFeUgHgByZY",
            authDomain: "uno-flex-f36e8.firebaseapp.com",
            databaseURL: "https://uno-flex-f36e8-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "uno-flex-f36e8",
            storageBucket: "uno-flex-f36e8.firebasestorage.app",
            messagingSenderId: "878978021695",
            appId: "1:878978021695:web:3995ae12c7575016497b8a"
        };

        let app, db;
        try { app = initializeApp(firebaseConfig); db = getDatabase(app); } 
        catch (error) { showToast("Gagal memuat Firebase!"); }

        // Pembersihan otomatis room lama
        async function cleanupOldRooms() {
            if (!db) return;
            try {
                const snapshot = await get(ref(db, 'rooms'));
                if (snapshot.exists()) {
                    const now = Date.now(), rooms = snapshot.val(), batasWaktu = 24 * 60 * 60 * 1000;
                    for (const roomId in rooms) {
                        if (!rooms[roomId].createdAt || (now - rooms[roomId].createdAt > batasWaktu)) remove(ref(db, `rooms/${roomId}`));
                    }
                }
            } catch(e) {}
        }
        setTimeout(cleanupOldRooms, 3000);

        let myPlayerId = 'player_' + Date.now() + Math.random().toString(36).substr(2, 5);
        let myName = '';
        let currentRoom = null;
        let isHost = false;
        let myIsActive = true; 
        
        // Elemen DOM
        const setupSection = document.getElementById('setup-section');
        const gameSection = document.getElementById('game-section');
        const displayRoomCode = document.getElementById('display-room-code');
        const displayMyName = document.getElementById('display-my-name');
        const connIndicator = document.getElementById('conn-indicator');
        const myPowerCard = document.getElementById('my-power-card');
        const myCardStatus = document.getElementById('my-card-status');
        const opponentsList = document.getElementById('opponents-list');

        // Indikator Koneksi
        if(db) {
            onValue(ref(db, ".info/connected"), (snap) => {
                if (snap.val() === true) {
                    connIndicator.className = "conn-dot";
                } else {
                    connIndicator.className = "conn-dot conn-red";
                }
            });
        }

        document.getElementById('btn-create-room').addEventListener('click', async () => {
            myName = document.getElementById('player-name').value.trim().toUpperCase();
            if (!myName) return showToast("MASUKKAN NAMA ANDA!");
            const newCode = generateRoomCode();
            currentRoom = newCode; isHost = true;
            try {
                await set(ref(db, `rooms/${newCode}`), { hostId: myPlayerId, createdAt: Date.now() });
                await joinRoomLogic(newCode, ref(db, `rooms/${newCode}/players/${myPlayerId}`));
            } catch(e) { showToast("GAGAL MEMBUAT ROOM"); }
        });

        document.getElementById('btn-join-room').addEventListener('click', async () => {
            myName = document.getElementById('player-name').value.trim().toUpperCase();
            let code = document.getElementById('room-code').value.trim().toUpperCase();
            if (!myName) return showToast("MASUKKAN NAMA ANDA!");
            if (!code) return showToast("MASUKKAN KODE ROOM!");
            try {
                const snapshot = await get(ref(db, `rooms/${code}`));
                if (snapshot.exists()) {
                    const players = snapshot.val().players || {};
                    if (Object.keys(players).length >= 8 && !players[myPlayerId]) return showToast("ROOM PENUH (MAKS 8)");
                    currentRoom = code;
                    await joinRoomLogic(code, ref(db, `rooms/${code}/players/${myPlayerId}`));
                } else showToast("ROOM TIDAK DITEMUKAN");
            } catch(e) { showToast("TERJADI KESALAHAN"); }
        });

        async function joinRoomLogic(roomCode, myPlayerRef) {
            await set(myPlayerRef, { id: myPlayerId, name: myName, isActive: true });
            onDisconnect(myPlayerRef).remove();

            setupSection.classList.add('hidden');
            gameSection.classList.remove('hidden');
            displayRoomCode.textContent = roomCode;
            displayMyName.textContent = myName;

            onValue(ref(db, `rooms/${roomCode}`), (snapshot) => {
                if (!snapshot.exists()) { showToast("ROOM DITUTUP"); setTimeout(() => window.location.reload(), 2000); return; }
                const data = snapshot.val(), players = data.players || {};
                if (!players[data.hostId] && Object.keys(players).length > 0) {
                    const newHostId = Object.keys(players)[0];
                    if (myPlayerId === newHostId) { isHost = true; update(ref(db, `rooms/${roomCode}`), { hostId: newHostId }); }
                } else isHost = (myPlayerId === data.hostId);

                renderPlayers(players);
                checkAllRedRule(players);
            });
        }

        // Logic Sentuh Kartu Sendiri
        document.getElementById('my-card-container').addEventListener('click', () => {
            if (!currentRoom) return;
            update(ref(db, `rooms/${currentRoom}/players/${myPlayerId}`), { isActive: !myIsActive });
        });

        function renderPlayers(players) {
            opponentsList.innerHTML = '';
            
            Object.values(players).forEach(p => {
                if (p.id === myPlayerId) {
                    // Update Kartu Sendiri
                    myIsActive = p.isActive;
                    if (p.isActive) {
                        myPowerCard.classList.remove('flipped');
                        myCardStatus.textContent = "KARTU AKTIF";
                    } else {
                        myPowerCard.classList.add('flipped');
                        myCardStatus.textContent = "KARTU NONAKTIF";
                    }
                } else {
                    // Render Daftar Lawan
                    const pillClass = p.isActive ? "pill-green" : "pill-red";
                    opponentsList.innerHTML += `
                        <div class="opp-item">
                            <div class="opp-name">${escapeHTML(p.name)}</div>
                            <div class="opp-pill ${pillClass}"></div>
                        </div>
                    `;
                }
            });
            
            if (opponentsList.innerHTML === '') {
                opponentsList.innerHTML = '<div style="text-align:center; color:#888; font-family:sans-serif; margin-top:20px;">Menunggu pemain lain...</div>';
            }
        }

        let isResetting = false;
        function checkAllRedRule(players) {
            const playerArray = Object.values(players);
            if (playerArray.length === 0) return;
            if (playerArray.every(p => p.isActive === false) && !isResetting) {
                isResetting = true;
                showToast("SEMUA MERAH! RESET KE HIJAU...", 2500);
                if (isHost) {
                    setTimeout(() => {
                        const updates = {};
                        playerArray.forEach(p => { updates[`rooms/${currentRoom}/players/${p.id}/isActive`] = true; });
                        update(ref(db), updates).then(() => { isResetting = false; }).catch(() => { isResetting = false; });
                    }, 1200); 
                } else setTimeout(() => { isResetting = false; }, 1800);
            }
        }

        function generateRoomCode() {
            let result = '', chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            for (let i = 0; i < 5; i++) result += chars.charAt(Math.floor(Math.random() * chars.length));
            return result;
        }

        function showToast(message, duration = 2000) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast'; toast.innerText = message;
            container.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; toast.style.transition = 'opacity 0.4s'; setTimeout(() => toast.remove(), 400); }, duration);
        }

        function escapeHTML(str) { return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)); }
    </script>
</body>
</html>
