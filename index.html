<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UNO Flex — Mobile Arena</title>
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="setup-container">
        <div class="logo-big luckiest">
            <span class="uno">UNO</span><br>
            <span style="color:#fff">FLEX!</span>
        </div>

        <div class="setup-panel">
            <div class="input-group">
                <div class="input-label label-green luckiest">👤 NAMA KAMU</div>
                <span class="input-icon">👤</span>
                <input type="text" id="player-name" class="input-box" placeholder="Masukkan nama..." autocomplete="off">
            </div>

            <div class="input-group" style="margin-bottom:15px;">
                <div class="input-label label-yellow luckiest"># KODE ROOM</div>
                <span class="input-icon" style="top:13px; font-size:1.3rem;">#</span>
                <input type="text" id="room-code" class="input-box" placeholder="Masukkan kode..." style="text-transform: uppercase;">
            </div>

            <div class="btn-row">
                <button id="btn-create-room" class="btn-game bg-green luckiest">➕ BUAT</button>
                <button id="btn-join-room" class="btn-game bg-blue luckiest">👥 GABUNG</button>
            </div>
        </div>
    </div>

    <div id="toast-container"></div>
    
    <!-- Script Logic Halaman Awal -->
    <script type="module" src="app.js"></script>

</body>
</html>
